# Hand-maintained copy of the clean.yml that sbt-typelevel generates.
# Generation is disabled via githubWorkflowIncludeClean in build.sbt,
# because the generated file cannot be customized.

name: Clean

on: push

permissions: {}

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  delete-artifacts:
    name: Delete Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete artifacts
        shell: bash
        run: |
          REPO="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"

          ghapi() { curl --silent --location --user "_:${GITHUB_TOKEN}" "$@"; }

          TMPFILE=$(mktemp)

          declare -A ARTCOUNT

          URL="${REPO}/actions/artifacts"
          while [[ -n "$URL" ]]; do
            JSON=$(ghapi --dump-header "$TMPFILE" "$URL")

            # Empty on the last page. HTTP/2 lowercases header names.
            URL=$(grep -i '^link:' "$TMPFILE" | tr ',' '\n' | grep 'rel="next"' | head -1 | sed -e 's/.*<//' -e 's/>.*//' || true)

            COUNT=$(jq <<<"$JSON" -r '.artifacts | length')

            for ((i=0; i < COUNT; i++)); do
              name=$(jq <<<"$JSON" -r ".artifacts[$i].name?")
              ARTCOUNT[$name]=$(( ${ARTCOUNT[$name]:-0} + 1 ))

              id=$(jq <<<"$JSON" -r ".artifacts[$i].id?")
              size=$(jq <<<"$JSON" -r ".artifacts[$i].size_in_bytes?")
              printf "Deleting '%s' #%d, %'d bytes\n" "$name" "${ARTCOUNT[$name]}" "$size"
              ghapi -X DELETE "${REPO}/actions/artifacts/${id}"
            done
          done
          rm -f "$TMPFILE"
